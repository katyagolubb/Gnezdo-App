  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    networks:
      - app_network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis


  redis:
    image: redis:7.0
    ports:
      - "6379:6379"
    networks:
      - app_network

  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - app_network
    depends_on:
      - user-management-api
      - book-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  book-api:
    build:
      context: ./book-api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - app_network
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:5000/api/books/suggestions/"]
#      interval: 30s
#      timeout: 10s
#      retries: 3

  user-management-api:
    build:
      context: ./user-management-api
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    networks:
      - app_network
    restart: always
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:5001/api/register/"]
#      interval: 30s
#      timeout: 10s
#      retries: 3

  # Если нужна балансировка нагрузки, раскомментируйте:
