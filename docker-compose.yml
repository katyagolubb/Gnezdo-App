  #     context: ./book-api
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5002:5000"
  #   networks:
  #     - app_network

  # user-management-api_2:
  #   build:
  #     context: ./user-management-api
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5003:5001"
  #   networks:
  #     - app_network

networks:
  app_network:
    driver: bridge